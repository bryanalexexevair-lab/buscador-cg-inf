<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Buscador CG INF</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <script type="module" src="./app.js"></script>
</head>
<body>
  <main>
    <h1>Buscador CG INF</h1>
    <p>Busca en la hoja mensual y en sus comentarios modernos.</p>
    <button id="searchButton" type="button">Buscar ahora</button>
    <button id="autoButton" type="button">Activar búsqueda automática</button>
    <p id="status" role="status" aria-live="polite">Conectando con Excel…</p>
    <p class="hint">Después de activar la búsqueda automática para este libro, puedes cerrar este panel. El botón de la cinta permite volver a abrirlo.</p>
  </main>
</body>
</html>
